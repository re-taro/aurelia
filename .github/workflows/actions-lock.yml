# .github/workflows/actions.lock がワークフローとずれていないか、ピンが upstream で検証できるかを確認する
name: Verify actions.lock

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 1'

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup | gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Run | Verify
        run: gh actions-lock --verify

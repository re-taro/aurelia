name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup | Toolchain
        uses: $/.github/actions/setup
      - name: Run | oxlint
        run: pnpm run lint:script
      - name: Run | textlint
        run: pnpm run lint:textlint
      - name: Run | oxfmt
        run: pnpm run format:check

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup | Toolchain
        uses: $/.github/actions/setup
      - name: Run | astro check
        run: pnpm run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup | Toolchain
        uses: $/.github/actions/setup
      - name: Run | vitest
        run: pnpm run test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup | Toolchain
        uses: $/.github/actions/setup
      - name: Run | astro build
        run: pnpm run build
